plugins {
    id 'java'
    id 'jacoco'
    id 'application'
    id 'checkstyle'
}

group = 'ru.nsu.dashkovskii'
version = '1.0-SNAPSHOT'

checkstyle {
    toolVersion = "10.12.5"
}

application {
    mainClass = 'ru.nsu.dashkovskii.PizzeriaManager'
}

run {
    standardInput = System.in
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation 'com.google.code.gson:gson:2.10.1'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

jacocoTestReport {
    reports {
        xml.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    'ru/nsu/dashkovskii/PizzeriaManager.class',
                    'ru/nsu/dashkovskii/service/Baker.class',
                    'ru/nsu/dashkovskii/service/Courier.class',
                    'ru/nsu/dashkovskii/service/PizzeriaClient.class',
                    'ru/nsu/dashkovskii/strategy/**',
                    'ru/nsu/dashkovskii/util/**'
            ])
        }))
    }
}