plugins {
    id 'java'
    id 'jacoco'
    id 'application'
    id 'checkstyle'
}

group = 'ru.nsu.dashkovskii'
version = '1.0-SNAPSHOT'

checkstyle {
    toolVersion = "10.12.5"
}

application {
    mainClass = 'ru.nsu.dashkovskii.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}